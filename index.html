<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Quiz Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen antialiased flex flex-col">

    <div class="max-w-5xl mx-auto px-4 py-8 w-full flex-grow flex flex-col">

        <!-- Header & Navigation -->
        <header class="mb-8 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
                <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight flex items-center gap-2">
                    <svg class="w-8 h-8 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                    PrepPortal
                </h1>
                <nav id="breadcrumbs" class="text-sm font-medium text-slate-500 mt-2 flex flex-wrap items-center gap-2">
                    <!-- Breadcrumbs injected dynamically -->
                </nav>
            </div>
            <div id="back-btn-container" class="hidden">
                <button onclick="goBack()" class="flex items-center space-x-1 text-sm font-semibold text-indigo-600 hover:text-indigo-800 transition bg-indigo-50 px-4 py-2 rounded-lg hover:bg-indigo-100 active:scale-95">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                    <span>Back</span>
                </button>
            </div>
        </header>

        <!-- Main Content Area -->
        <main id="app-container" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8 flex-grow relative overflow-hidden flex flex-col justify-center min-h-[400px]">
            <!-- Views injected here via JS -->
            <div class="text-center">
                <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600"></div>
                <p class="mt-4 text-slate-500 font-medium">Loading Quiz Data...</p>
            </div>
        </main>
    </div>

    <!-- Application Logic -->
    <script src="scripts/dashboard.js"></script>
</body>
</html>
