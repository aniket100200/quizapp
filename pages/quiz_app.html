<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Viewport settings optimized for Android WebView to prevent unwanted zooming -->
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
          name="viewport">
    <title>Maths Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom accent color for a modern look */
        body {
            background-color: #f8fafc; /* Tailwind slate-50 */
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent; /* Removes default tap highlight on Android */
        }
        /* Hiding default radio button to style it via Tailwind */
        input[type="radio"]:checked + .radio-indicator {
            background-color: #3b82f6;
            border-color: #3b82f6;
        }
        input[type="radio"]:checked + .radio-indicator::after {
            content: '';
            display: block;
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            margin: auto;
            margin-top: 4px;
        }
    </style>
</head>
<body class="text-slate-800">

<!-- Main Header -->
<header class="bg-blue-600 text-white p-4 sticky top-0 z-10 shadow-md">
    <h1 class="text-2xl font-bold text-center" id="subject-title">Loading Subject...</h1>
</header>

<!-- Main Container -->
<!-- Added padding bottom (pb-24) to ensure content isn't hidden behind the sticky submit button -->
<main class="max-w-lg mx-auto p-4 pb-28">

    <!-- Quiz View -->
    <div id="quiz-view">
        <div id="quiz-container">
            <!-- Topics and Questions will be injected here by JavaScript -->
        </div>
    </div>

    <!-- Results View (Hidden by default) -->
    <div class="hidden" id="results-view">
        <div class="bg-white rounded-xl shadow-sm p-6 mb-6 text-center border-t-4 border-blue-500">
            <h2 class="text-3xl font-bold text-slate-800 mb-2">Quiz Complete!</h2>
            <p class="text-xl font-semibold text-blue-600" id="score-display">You scored X out of
                Y</p>
        </div>

        <h3 class="text-lg font-bold text-slate-700 mb-4 px-2">Detailed Breakdown:</h3>
        <div id="breakdown-container">
            <!-- Result breakdown will be injected here -->
        </div>

        <button class="w-full mt-6 bg-slate-200 hover:bg-slate-300 text-slate-800 font-semibold py-4 px-6 rounded-xl transition duration-200 shadow-sm"
                onclick="location.reload()">
            Retake Quiz
        </button>
    </div>

</main>

<!-- Sticky Submit Button Footer (Hidden on results view) -->
<div class="fixed bottom-0 left-0 right-0 p-4 bg-white border-t border-slate-200 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-10"
     id="submit-footer">
    <div class="max-w-lg mx-auto">
        <button class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold py-4 px-6 rounded-xl transition duration-200 shadow-md flex justify-center items-center"
                onclick="submitQuiz()">
            Submit Quiz
        </button>
    </div>
</div>
<script src="../scripts/main.js">
    
</script>
<script src="../scripts/quiz_script.js">

</script>
</body>
</html>
